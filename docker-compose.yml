services:
  wa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-gateway
    restart: unless-stopped
    
    ports:
      - "3002:3002"
    
    environment:
      - NODE_ENV=PRODUCTION
      - PORT=3002
      - KEY=${KEY:-}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_PATH=/app/db/wa_gateway.db
      # Bridge multi-canal (ponte /ingress/:tenant + /bridge/agent)
      - BRIDGE_TENANTS=${BRIDGE_TENANTS:-}
      # Autoriza a plataforma de agentes a REGISTRAR tenant em runtime
      # (PUT /bridge/tenants/<nome>), sem reiniciar este processo — reiniciar
      # derruba a ponte de todos os bots que estão no ar. Tem que ser o mesmo
      # valor configurado como BRIDGE_ADMIN_TOKEN no control-plane.
      # Vazio = rotas de registro desligadas (fail-closed); só vale o
      # BRIDGE_TENANTS do env, como era antes.
      - BRIDGE_ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN:-}
      # Observabilidade: token que o Gatus usa em /status e /status/:session.
      # Vazio = endpoints devolvem 503 (e o monitoramento alerta — de propósito,
      # é melhor gritar do que ficar verde sem estar medindo nada).
      - STATUS_TOKEN=${STATUS_TOKEN:-}
      # Backup do sqlite (usuários, callbacks e tokens de webhook). 0 desliga.
      - DB_BACKUP_INTERVAL_HOURS=${DB_BACKUP_INTERVAL_HOURS:-24}
      - DB_BACKUP_KEEP=${DB_BACKUP_KEEP:-7}
      # Login Microsoft (Entra ID) — só para humano no browser. As rotas de
      # máquina (/message, /profile, /session) seguem em Basic.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://wa-gateway.odd.com.br}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
      - AZURE_AD_ADMIN_GROUP_ID=${AZURE_AD_ADMIN_GROUP_ID:-}
      - ENTRA_BREAKGLASS_WIDS=${ENTRA_BREAKGLASS_WIDS:-62e90394-69f5-4237-9190-012177145e10,e8611ab8-c189-46e8-94e1-60213ab1f814}
      - WEB_SESSION_HOURS=${WEB_SESSION_HOURS:-12}
      # Rede de segurança da transição: com true, o Basic continua valendo nas
      # rotas humanas. Vira false na Fase 4.
      - AUTH_ALLOW_BASIC_FALLBACK=${AUTH_ALLOW_BASIC_FALLBACK:-true}

    volumes:
      # Mount WhatsApp credentials directory
      - ./wa_credentials:/app/wa_credentials
      # Mount media directory
      - ./media:/app/media
      # Mount database directory
      - ./db:/app/db
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - wa-gateway-network

networks:
  wa-gateway-network:
    driver: bridge
