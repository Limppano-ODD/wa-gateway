name: CI

# O repo tinha deploy (deploy.yml) mas nenhuma verificação antes dele: os testes
# da ponte só rodavam na máquina de quem escreveu. Num serviço que atende
# WhatsApp de cliente, "passou aqui" não pode ser a garantia.
on:
  pull_request:
  push:
    branches: [master, hml]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version:` de propósito — a action lê o campo `packageManager` do
      # package.json. Assim CI, Docker e máquina local usam o MESMO pnpm, e o
      # lockfile para de mudar de forma dependendo de quem rodou o install.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: falha se o pnpm-lock.yaml não bater com o
      # package.json. É o que impede uma resolução diferente de dependência
      # entrar em produção sem ninguém ter decidido isso — foi assim que o
      # audio-decode (peer opcional do Baileys) sumiu do lockfile sem intenção.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes
        run: pnpm test

      # Typecheck do repo INTEIRO, sem filtro.
      #
      # Antes este passo era `tsc ... | (! grep -E "src/bridge/|src/env.ts")`,
      # e passava verde SEM NUNCA TER CHECADO NADA: `typescript` não estava
      # instalado, `pnpm exec tsc` falhava com "Command not found", a mensagem
      # de erro não casava com o grep, o `!` invertia e o passo ficava verde.
      # Um gate que não gateia é pior que gate nenhum, porque cria confiança.
      #
      # Com o typescript agora fixado em devDependencies, sobravam 2 erros
      # (ambos em session.ts, mesma linha), já corrigidos. Sem erro pendente,
      # não há motivo para filtro: qualquer erro novo reprova, em qualquer
      # arquivo. Se um dia precisar excluir algo, exclua por caminho no
      # tsconfig, não por grep na saída.
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p .
